<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self'; img-src 'self' data:"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Grok Desktop Visual Fixture</title>
    <link rel="stylesheet" href="../../renderer/styles.css" />
    <link rel="stylesheet" href="../../renderer/polish.css" />
  </head>
  <body class="theme-light palette-paper visual-fixture">
    <div id="app">
      <header id="app-chrome">
        <div class="chrome-left">
          <button class="chrome-settings" type="button">设置</button>
          <span class="quota-chip"><span class="quota-chip-k">周限额</span><b>18%</b></span>
          <span class="quota-chip quota-chip-plain">周五 18:50 刷新</span>
        </div>
      </header>
      <div id="app-body">
        <aside id="sidebar">
          <nav class="rail-nav" aria-label="主导航">
            <button class="rail-item active" type="button">对话</button>
            <button class="rail-add" type="button">+</button>
            <button class="rail-item" type="button">记忆</button>
            <button class="rail-item" type="button">技能</button>
            <button class="rail-item" type="button">插件</button>
          </nav>
          <div class="session-panel">
            <div class="panel-head"><span>最近会话</span><button class="icon-btn">↻</button></div>
            <label class="search-box"><span>⌕</span><input placeholder="搜索标题 / 全文…" /></label>
            <div class="session-list">
              <section class="project">
                <button class="project-head" type="button">
                  <span>▾</span><span class="name">grok-desktop</span>
                </button>
                <div class="project-body">
                  <button class="session-row active" type="button">
                    <span class="s-ind done"></span><span class="title">展示与长会话优化</span>
                  </button>
                  <button class="session-row" type="button">
                    <span class="s-ind"></span><span class="title">修复历史消息顺序</span>
                  </button>
                </div>
              </section>
            </div>
          </div>
        </aside>
        <main id="workspace">
          <div id="view-chat" class="view active">
            <header class="topbar">
              <div class="topbar-left">
                <h1>展示与长会话优化</h1>
                <p class="sub">C:\workspace\grok-desktop</p>
              </div>
              <div class="status" data-state="ready">就绪</div>
            </header>
            <div class="chat-body">
              <div class="thread-shell">
                <div id="thread" class="thread">
                  <div class="thread-inner">
                    <article class="turn user">
                      <div class="turn-who">你</div>
                      <div class="body">继续完成这些内容，并检查窄窗口下的展示。</div>
                    </article>
                    <section class="thought-block" id="fixture-thought-closed">
                      <button class="thought-head" aria-expanded="false">
                        <span class="thought-label">思考了 4.2 秒</span
                        ><span class="thought-step-count">· 2 个步骤</span
                        ><span class="t-chev">▾</span>
                      </button>
                      <div class="thought-flow">
                        <div class="thought md">先分析问题并决定读取相关代码。</div>
                        <div class="thought-steps">
                          <section class="tool-group settled" id="fixture-completed-tools">
                            <button class="tool-group-head" type="button" aria-expanded="false">
                              <span class="tool-group-title">完成 6 项操作</span
                              ><span class="tool-group-meta">读取 3 · 修改 2 · 检查 1</span>
                            </button>
                            <div class="tool-group-body">
                              <div class="tool-card done">
                                <div class="t-head">
                                  <span class="t-title">检查界面结构</span
                                  ><span class="t-status">完成</span>
                                </div>
                              </div>
                            </div>
                          </section>
                          <div
                            class="diff-card done"
                            id="fixture-diff-success"
                            data-id="edit-1"
                            data-status="completed"
                          >
                            <button type="button" class="diff-card-head" aria-expanded="false">
                              <span class="d-badge">Edit</span>
                              <span class="d-path">renderer/app.js</span>
                              <span class="d-count">2 次修改</span>
                              <span class="d-status hidden"></span>
                              <span class="d-stats"
                                ><span class="add">+4</span> <span class="del">−2</span></span
                              >
                              <span class="t-chev">▾</span>
                            </button>
                            <div class="diff-actions"></div>
                            <div class="diff-card-body"></div>
                          </div>
                        </div>
                        <div class="thought md" id="fixture-thought-second">
                          工具完成后继续思考，位于工具步骤之后。
                        </div>
                      </div>
                    </section>
                    <article class="turn assistant final-answer" id="fixture-final">
                      <div class="turn-who">
                        <span>Grok</span><span class="response-kind">最终答复</span>
                      </div>
                      <div class="body md">
                        <p class="md-p">
                          修复已经完成。思考默认折叠，过程与最终答复有明确层级，工具步骤会聚合展示。
                        </p>
                      </div>
                    </article>
                  </div>
                </div>
              </div>
            </div>
            <div id="composer-dock">
              <div id="composer" class="composer">
                <textarea
                  id="input"
                  rows="1"
                  placeholder="消息 · 拖入图片 · / 命令 · + 附加文件…"
                ></textarea>
                <div class="composer-bar">
                  <div class="composer-left">
                    <button class="btn-attach-plus">+</button
                    ><button class="btn-work-mode">完全访问⌄</button>
                  </div>
                  <div class="composer-right">
                    <button class="btn-model">Grok 4.5 · 高⌄</button
                    ><button class="btn send">↑</button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>
  </body>
</html>
