name: checks

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:audit
      - run: npm run check
      - if: runner.os == 'Windows'
        run: npm run check:electron
      - if: runner.os == 'Windows'
        run: npm run check:visual
      - if: runner.os == 'Windows'
        run: npm run check:conversation
      - if: runner.os == 'Windows'
        run: npm run check:files
      - if: runner.os == 'Windows'
        run: npm run check:markdown
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ui-regression-windows
          path: artifacts/ui-regression/
